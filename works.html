<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — Pietro Caruso</title>
  <style>
    /* Reset di base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      line-height: 1.6;
      padding: 2rem;
    }

    /* Navbar superiore */
    header.navbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 4rem;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
    }

    .nav-btn {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      background-color: #000000;
      color: #ffffff;
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    .nav-btn:hover {
      opacity: 0.8;
    }

    /* Contenitore Principale */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 4rem;
    }

    /* Titolo Pagina */
    .page-title {
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      margin-bottom: 3rem;
    }

    /* Griglia Progetti */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 4rem 3rem;
    }

    /* Card Singolo Progetto */
    .work-card {
      display: flex;
      flex-direction: column;
    }

    /* Embed Video Youtube Responsivo (16:9) */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      background-color: #000000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Info Progetto */
    .work-info {
      margin-top: 1.25rem;
    }

    .work-title {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
    }

    .work-role {
      font-size: 0.85rem;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      display: block;
    }

    .work-description {
      font-size: 0.95rem;
      color: #333333;
      font-weight: 300;
    }

    /* Layout per Schermi Piccoli (Mobile) */
    @media (max-width: 600px) {
      body {
        padding: 1.5rem;
      }

      .page-title {
        font-size: 2.5rem;
        margin-bottom: 2rem;
      }

      .works-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
    }
  </style>
</head>
<body>

  <!-- Menu Navigazione -->
  <header class="navbar">
    <nav class="nav-links">
      <a href="/" class="nav-btn">home</a>
      <a href="about.html" class="nav-btn">about me</a>
    </nav>
  </header>

  <!-- Contenuto Pagina Works -->
  <main>
    <h1 class="page-title">Works</h1>

    <div class="works-grid">

      <!-- PROGETTO 1 -->
      <article class="work-card">
        <div class="video-container">
          <!-- Sostituisci SOSTITUISCI_CON_ID_VIDEO_1 con l'ID del video di YouTube -->
          <iframe 
            src="https://www.youtube-nocookie.com/embed/mrmB7_8_-ws"
            title="L'attesa" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="work-info">
          <h2 class="work-title">L'attesa</h2>
          <span class="work-role">Regia</span>
          <p class="work-description">
            come l'uomo percepisce l'attesa
          </p>
        </div>
      </article>

      <!-- PROGETTO 2 -->
      <article class="work-card">
        <div class="video-container">
          <!-- Sostituisci SOSTITUISCI_CON_ID_VIDEO_2 con l'ID del secondo video -->
          <iframe 
            src="https://www.youtube-nocookie.com/embed/JXU1on0ZZjA" 
            title="Il barbiere" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="work-info">
          <h2 class="work-title">Il barbiere</h2>
          <span class="work-role">Regia</span>
          <p class="work-description">
            Una semplice presentazione di un barbiere.
          </p>
        </div>
      </article>

      <!-- PROGETTO 3 -->
      <article class="work-card">
        <div class="video-container">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/-nzQ_KYx5XE" 
            title="La macchina" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="work-info">
          <h2 class="work-title">La macchina</h2>
          <span class="work-role">Regia</span>
          <p class="work-description">
              una semplice esercitazione di una maccchina che non parte.
          </p>
        </div>
      </article>
      <article class="work-card">
        <div class="video-container">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/TRLZUTu7Sgo" 
            title="L'uomo nero e bianco" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="work-info">
          <h2 class="work-title">L'uomo nero e bianco</h2>
          <span class="work-role">Regia</span>
          <p class="work-description">
            la tristezza di un uomo diverso
          </p>
        </div>
      </article>

    </div>
  </main>

</body>
</html>
